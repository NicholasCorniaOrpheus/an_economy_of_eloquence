site_name: An Economy of Eloquence
site_author: Nicholas Cornia
repo_url: https://github.com/NicholasCorniaOrpheus/an_economy_of_eloquence
nav:
  - Home: index.md
  - Wat is this game about?: about.md
  - Core Rules: core_rules.md
  - Playing the Game: playing_the_game.md

plugins:
  - search

extra_css:
  - assets/css/extras.css

#extra_javascript:
  #- assets/javascripts/extra.js

theme:
  name: material
  #custom_dir: overrides
  #logo: assets/images/faam-logo-gold.png
  #favicon: assets/images/favicon.ico
  language: en
  icon:
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right
    admonition:
      abstract: fontawesome/solid/book
      note: fontawesome/solid/note-sticky
      quote: fontawesome/solid/quote-left

  font:
      text: Crimson Pro
  palette:
    - scheme: default
      primary: custom
      default: custom
      footer: custom
      accent: amber     

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.prune
    - search.share
    - toc.integrate


copyright: Copyright &copy; 2025 Orpheus Instituut, Resounding Libraries

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NicholasCorniaOrpheus
      name: GitHub repository
  social:
    - icon: material/music-note
      link: https://orpheusinstituut.be/
      name: Orpheus Instituut

markdown_extensions:
  - footnotes
  - tables
  - attr_list
  - admonition
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  # icons extension!
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
